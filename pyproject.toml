[project]
name = "nescal"
version = "0.1.0"
requires-python = ">=3.10"
description = "Neighborhood Smoothing for Calibration (NeSCal)"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
